<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Us a Review ⭐ — Wow Mobile Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4A853;
    --gold-light: #F2C96E;
    --dark: #0E0C09;
    --card: #1A1712;
    --border: rgba(212,168,83,0.25);
    --text: #F5EFE0;
    --muted: #8A7D65;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212,168,83,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(212,168,83,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeDown 0.7s ease both;
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  .star {
    font-size: 26px;
    animation: starPop 0.5s ease both;
  }
  .star:nth-child(1) { animation-delay: 0.1s; }
  .star:nth-child(2) { animation-delay: 0.2s; }
  .star:nth-child(3) { animation-delay: 0.3s; }
  .star:nth-child(4) { animation-delay: 0.4s; }
  .star:nth-child(5) { animation-delay: 0.5s; }

  @keyframes starPop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    70% { transform: scale(1.2) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 6.5vw, 34px);
    font-weight: 900;
    color: var(--gold-light);
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--muted);
    font-size: 13px;
    font-weight: 300;
  }

  .review-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 22px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.6s ease 0.3s both;
  }

  .review-card::before {
    content: '"';
    position: absolute;
    top: -10px;
    left: 16px;
    font-family: 'Playfair Display', serif;
    font-size: 120px;
    color: rgba(212,168,83,0.07);
    line-height: 1;
    pointer-events: none;
  }

  .review-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(212,168,83,0.1);
    border: 1px solid rgba(212,168,83,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .review-text {
    font-size: 14.5px;
    line-height: 1.78;
    color: var(--text);
    font-weight: 300;
    position: relative;
    z-index: 1;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .review-text.fading {
    opacity: 0;
    transform: translateY(6px);
  }

  .action-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 14px;
    animation: fadeUp 0.6s ease 0.45s both;
  }

  .shuffle-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 16px;
    color: var(--gold);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: all 0.2s ease;
  }

  .shuffle-btn:hover { background: rgba(212,168,83,0.08); border-color: var(--gold); }

  .shuffle-icon { display: inline-block; transition: transform 0.45s ease; }
  .shuffle-icon.spin { transform: rotate(360deg); }

  .btn-copy {
    width: 100%;
    background: linear-gradient(135deg, var(--gold) 0%, #B8882A 100%);
    color: #0E0C09;
    border: none;
    border-radius: 14px;
    padding: 16px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s ease;
    margin-bottom: 12px;
    animation: fadeUp 0.6s ease 0.55s both;
  }

  .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(212,168,83,0.35); }
  .btn-copy:active { transform: translateY(0); }
  .btn-copy.copied { background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%); color: #fff; }

  .divider {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin: 4px 0 12px;
    animation: fadeUp 0.6s ease 0.6s both;
  }

  .btn-google {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s ease;
    text-decoration: none;
    animation: fadeUp 0.6s ease 0.65s both;
  }

  .btn-google:hover { background: rgba(255,255,255,0.04); border-color: rgba(212,168,83,0.4); }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

</div>

  // Track last shown index to avoid immediate repeats
  let lastIndex = -1;

  function getRandomIndex() {
    if (reviews.length === 1) return 0;
    let idx;
    do { idx = Math.floor(Math.random() * reviews.length); } while (idx === lastIndex);
    lastIndex = idx;
    return idx;
  }

  function showReview(animate = true) {
    const el = document.getElementById('reviewText');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');

    copyBtn.classList.remove('copied');
    copyBtnText.textContent = 'Copy & Open Google Reviews';

    if (animate) {
      el.classList.add('fading');
      setTimeout(() => {
        el.textContent = reviews[lastIndex];
        el.classList.remove('fading');
      }, 260);
    } else {
      el.textContent = reviews[lastIndex];
    }
  }

  function nextReview() {
    // Spin icon
    const icon = document.getElementById('shuffleIcon');
    icon.classList.remove('spin');
    void icon.offsetWidth; // reflow to restart animation
    icon.classList.add('spin');
    setTimeout(() => icon.classList.remove('spin'), 460);

    getRandomIndex();
    showReview(true);
  }

  async function copyAndRedirect() {
    const review = reviews[lastIndex];
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');

    try {
      await navigator.clipboard.writeText(review);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = review;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    copyBtn.classList.add('copied');
    copyBtnText.textContent = '✓ Copied! Opening Google…';

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);

    setTimeout(() => window.open(GOOGLE_REVIEW_URL, '_blank'), 900);
  }

  // Init — pick a random review immediately on load
  getRandomIndex();
  showReview(false);
</script>
